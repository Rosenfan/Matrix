<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Matrix 工作流海报</title>
  <desc id="description">Matrix Workflow 中文产品海报，使用连续五阶段证据链与 Codex、Claude Code 的交接带展示开发流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020806"/><stop offset=".56" stop-color="#09271b"/><stop offset="1" stop-color="#020a07"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22ff9f" stop-opacity="0"/><stop offset=".5" stop-color="#22ff9f" stop-opacity=".16"/><stop offset="1" stop-color="#22ff9f" stop-opacity="0"/></linearGradient>
    <linearGradient id="stageSurface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#103c29"/><stop offset="1" stop-color="#092719"/></linearGradient>
    <radialGradient id="heroLight" cx="78%" cy="18%" r="72%"><stop stop-color="#1d7c51" stop-opacity=".38"/><stop offset=".48" stop-color="#0b2d20" stop-opacity=".16"/><stop offset="1" stop-color="#020806" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#70ffb4" stroke-opacity=".014"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
