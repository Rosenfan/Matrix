<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Matrix 工作流海报</title>
  <desc id="description">Matrix 单一入口双轨 AI 工程工作流海报：Auto 自主定案并由 Runtime 实跑检查，Classic 提供五阶段软件契约门禁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020806"/>
      <stop offset=".54" stop-color="#082419"/>
      <stop offset="1" stop-color="#020a07"/>
    </linearGradient>
    <radialGradient id="hero" cx="76%" cy="16%" r="70%">
      <stop offset="0" stop-color="#1d7c51" stop-opacity=".36"/>
      <stop offset=".5" stop-color="#0b2d20" stop-opacity=".15"/>
      <stop offset="1" stop-color="#020806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22ff9f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22ff9f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22ff9f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="autoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11422d"/>
      <stop offset="1" stop-color="#082318"/>
    </linearGradient>
    <linearGradient id="classicCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2d1f"/>
      <stop offset="1" stop-color="#071b13"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#70ffb4" stroke-opacity=".016"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .zh{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}
      .mono{font-family:Consolas,'SFMono-Regular',monospace}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#78fbb7}
      .title{font-size:74px;font-weight:700;letter-spacing:-1px;fill:#f5fff9}
      .subtitle{font-size:21px;fill:#cdeadd}
      .label{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#82ffc0}
      .tiny{font-size:13.5px;fill:#9ec5b1}
      .hostPrimary{font-size:16px;font-weight:700;fill:#effff7}
      .hostSub{font-size:14px;fill:#b4d6c4}
      .stageStep{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#8cffc6}
      .stageTitle{font-size:27px;font-weight:700;fill:#f3fff9}
      .stageLead{font-size:16px;font-weight:700;fill:#dff9ec}
      .stageBullet{font-size:14px;fill:#b3d5c3}
      .classicStep{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#7ef2b8}
      .classicTitle{font-size:20px;font-weight:700;fill:#ecfff5}
      .classicMeta{font-size:13.5px;fill:#a7cbb8}
      .featureTitle{font-size:19px;font-weight:700;fill:#f2fff8}
      .featureText{font-size:14px;fill:#b6d6c4}
      .badgeText{font-size:11.5px;font-weight:700;letter-spacing:1px;fill:#052015}
      .badgeOutlineText{font-size:11.5px;font-weight:700;letter-spacing:1px;fill:#8cffc6}
      .footer{font-size:21px;font-weight:700;fill:#effff7}
      .panel{fill:#061710;fill-opacity:.48;stroke:#70ffb4;stroke-opacity:.14;stroke-width:1}
      .hostBox{fill:#092218;fill-opacity:.62;stroke:#8cffc6;stroke-opacity:.18;stroke-width:1}
      .autoStage{fill:url(#autoCard);stroke:#9dffd0;stroke-opacity:.26;stroke-width:1.2}
      .classicStage{fill:url(#classicCard);stroke:#8cffc6;stroke-opacity:.16;stroke-width:1}
      .feature{fill:#0b261b;fill-opacity:.64;stroke:#a4ffd0;stroke-opacity:.14;stroke-width:1}
      .badgeFill{fill:#78fbb7}
      .badgeOutline{fill:#103927;stroke:#78fbb7;stroke-opacity:.45;stroke-width:1}
      .rail{stroke:#78fbb7;stroke-opacity:.5;stroke-width:2;fill:none}
      .divider{stroke:#a4ffd0;stroke-opacity:.16;stroke-width:1}
      .chev{fill:none;stroke:#9dffd0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#hero)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M96 226H1824" stroke="url(#beam)" stroke-width="1.5"/>

  <g class="zh">
    <!-- Header -->
    <text x="96" y="84" class="eyebrow">开源 · 证据驱动的 AI Agent 工作流</text>
    <text x="96" y="162" class="title">Matrix 工作流</text>
    <text x="96" y="202" class="subtitle">单一 $matrix 入口：Auto 自主定案并实跑真实检查，Classic 提供五阶段软件契约门禁。</text>

    <!-- Platform & Token Efficiency Box -->
    <g transform="translate(1216 58)">
      <rect width="608" height="148" rx="14" class="hostBox"/>
      <text x="24" y="32" class="label">宿主平台覆盖与省 TOKEN 协同纪律</text>
      <path d="M24 44H584" class="divider"/>
      <text x="24" y="72" class="hostPrimary">原生宿主入口：Claude Code · Codex · ZCode</text>
      <text x="24" y="98" class="hostSub">共享 .agents/skills 开放标准：opencode · Kimi Code 等兼容工具</text>
      <text x="24" y="126" class="tiny">brief.md / plan.md 锁定文件坐标 + 轻量模型子代理切片施工，免去全仓重扫</text>
    </g>

    <!-- Main Dual-Workflow Control Plane -->
    <rect x="96" y="242" width="1728" height="524" rx="20" class="panel"/>

    <!-- AUTO Track Header -->
    <g transform="translate(132 268)">
      <rect width="88" height="24" rx="6" class="badgeFill"/>
      <text x="44" y="16" text-anchor="middle" class="badgeText">默认推荐</text>
      <text x="102" y="17" class="label">AUTO 工作流 · 面向任意目标的通用自主 RUN</text>
      <text x="1656" y="17" text-anchor="end" class="tiny mono">UNDERSTAND → EXECUTE → VERIFY → CLOSE</text>
    </g>

    <path d="M160 424H1760" class="rail" filter="url(#glow)"/>

    <!-- AUTO 4 Stages: 4 * 390 + 3 * 32 = 1656 -->
    <g transform="translate(132 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep mono">01 · UNDERSTAND</text>
      <text x="26" y="74" class="stageTitle">调查与框定</text>
      <text x="26" y="108" class="stageLead">先查代码与 Git 历史，仅在边界提问</text>
      <text x="26" y="144" class="stageBullet">• 冻结目标、可观测验收 A1..An 与检查 C1..Cn</text>
      <text x="26" y="170" class="stageBullet">• 携带字面量凭据的检查命令直接拒绝</text>
      <text x="26" y="196" class="stageBullet">• brief.md 记录精确目标文件与接缝坐标</text>
    </g>

    <g transform="translate(554 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep mono">02 · EXECUTE</text>
      <text x="26" y="74" class="stageTitle">切片执行与实跑提交</text>
      <text x="26" y="108" class="stageLead">自主切片推进，Runtime 实跑检查</text>
      <text x="26" y="144" class="stageBullet">• 方案调整经 run pivot 记录并重置本轮结论</text>
      <text x="26" y="170" class="stageBullet">• 支持派生轻量模型子代理按坐标低耗施工</text>
      <text x="26" y="196" class="stageBullet">• run submit 锁外实跑检查，只按退出码裁定</text>
    </g>

    <g transform="translate(976 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep mono">03 · VERIFY</text>
      <text x="26" y="74" class="stageTitle">逐项诚实验收</text>
      <text x="26" y="108" class="stageLead">逐一覆盖全部验收项并声明审查来源</text>
      <text x="26" y="144" class="stageBullet">• 如实声明来源：self | subagent | external</text>
      <text x="26" y="170" class="stageBullet">• 未通过项退回 execute 并统计连续停滞</text>
      <text x="26" y="196" class="stageBullet">• 提交通过后工作区若有改动则自动打回</text>
    </g>

    <g transform="translate(1398 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep mono">04 · CLOSE</text>
      <text x="26" y="74" class="stageTitle">原子归档与沉淀</text>
      <text x="26" y="108" class="stageLead">渲染只读报告并释放工作区租约</text>
      <text x="26" y="144" class="stageBullet">• Runtime 从账本状态渲染 verification.md</text>
      <text x="26" y="170" class="stageBullet">• 原子归档至 .matrix/archive/runs/&lt;id&gt;/</text>
      <text x="26" y="196" class="stageBullet">• 将已验证工程事实沉淀至 AGENTS.md / ADR</text>
    </g>

    <path d="M534 415l9 9-9 9M956 415l9 9-9 9M1378 415l9 9-9 9" class="chev"/>

    <text x="132" y="568" class="tiny">适用任何目标：代码开发 · 技术调研 · 架构审视 · 运维排查 · 文档工程</text>
    <text x="1788" y="568" text-anchor="end" class="tiny mono">精简安装：matrix + matrix-status</text>

    <!-- Track Divider -->
    <path d="M132 590H1788" class="divider"/>

    <!-- CLASSIC Compact Track: 5 * 312 + 4 * 24 = 1656 -->
    <g transform="translate(132 608)">
      <rect width="94" height="22" rx="6" class="badgeOutline"/>
      <text x="47" y="15" text-anchor="middle" class="badgeOutlineText mono">CLASSIC</text>
      <text x="108" y="16" class="label">五阶段软件开发证据链（FULL · HOTFIX · TWEAK）</text>
      <text x="1656" y="16" text-anchor="end" class="tiny">字节级冻结 Contract · 阶段守卫 · 可选 Arch 编排 · Return / Abort 受控恢复</text>
    </g>

    <g transform="translate(132 644)">
      <g transform="translate(0 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep mono">01 · OPEN</text>
        <text x="20" y="56" class="classicTitle">澄清提案</text>
        <text x="20" y="78" class="classicMeta">proposal.md · 目标、范围与风险</text>
      </g>
      <g transform="translate(336 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep mono">02 · DESIGN</text>
        <text x="20" y="56" class="classicTitle">冻结契约</text>
        <text x="20" y="78" class="classicMeta">design · plan · 执行主体门禁</text>
      </g>
      <g transform="translate(672 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep mono">03 · BUILD</text>
        <text x="20" y="56" class="classicTitle">纵向切片构建</text>
        <text x="20" y="78" class="classicMeta">TDD · 按文件坐标直达实现</text>
      </g>
      <g transform="translate(1008 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep mono">04 · VERIFY</text>
        <text x="20" y="56" class="classicTitle">双轴审查验证</text>
        <text x="20" y="78" class="classicMeta">Standards &amp; Spec · Arch 回执</text>
      </g>
      <g transform="translate(1344 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep mono">05 · ARCHIVE</text>
        <text x="20" y="56" class="classicTitle">两步乐观归档</text>
        <text x="20" y="78" class="classicMeta">dry-run 预演 · sha256 哈希提交</text>
      </g>
      <path d="M320 40l7 7-7 7M656 40l7 7-7 7M992 40l7 7-7 7M1328 40l7 7-7 7" class="chev"/>
    </g>

    <!-- Bottom 4 Feature Cards: 4 * 414 + 3 * 24 = 1728 -->
    <g transform="translate(96 792)">
      <g transform="translate(0 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="58" height="22" rx="5" class="badgeFill"/>
        <text x="53" y="35" text-anchor="middle" class="badgeText mono">AUTO</text>
        <text x="24" y="70" class="featureTitle">Runtime 锁外实跑门禁</text>
        <text x="24" y="98" class="featureText">由 Runtime 亲自实跑冻结检查并按退出码裁定；</text>
        <text x="24" y="120" class="featureText">验收后若工作区发生变动则自动打回重审。</text>
      </g>

      <g transform="translate(438 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="82" height="22" rx="5" class="badgeOutline"/>
        <text x="65" y="35" text-anchor="middle" class="badgeOutlineText mono">CLASSIC</text>
        <text x="24" y="70" class="featureTitle">双轴审查与回执绑定</text>
        <text x="24" y="98" class="featureText">Runtime 强制校验 Standards 与 Spec 双轴证据；</text>
        <text x="24" y="120" class="featureText">Arch 进一步将契约、diff 与工作区哈希绑定为回执。</text>
      </g>

      <g transform="translate(876 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="132" height="22" rx="5" class="badgeOutline"/>
        <text x="90" y="35" text-anchor="middle" class="badgeOutlineText mono">AUTO · CLASSIC</text>
        <text x="24" y="70" class="featureTitle">磁盘账本与低耗接续</text>
        <text x="24" y="98" class="featureText">.matrix/ 预写日志、revision 与 continuation</text>
        <text x="24" y="120" class="featureText">让任意 Agent 按坐标直接接续，免去全仓重扫。</text>
      </g>

      <g transform="translate(1314 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="58" height="22" rx="5" class="badgeFill"/>
        <text x="53" y="35" text-anchor="middle" class="badgeText mono">AUTO</text>
        <text x="24" y="70" class="featureTitle">单租约隔离与停滞熔断</text>
        <text x="24" y="98" class="featureText">单工作区唯一活动租约；连续检查失败或同一批</text>
        <text x="24" y="120" class="featureText">未决项停滞满 2 轮即自动暂停交由人类拍板。</text>
      </g>
    </g>

    <!-- Footer -->
    <path d="M96 962H1824" class="divider"/>
    <text x="96" y="1018" class="footer">让自主 AI 协作成为有账可查、随时可续、低 Token 损耗的工程交付系统。</text>
    <text x="1824" y="994" text-anchor="end" class="label">项目仓库</text>
    <text x="1824" y="1030" text-anchor="end" class="mono" font-size="25" font-weight="700" fill="#effff6">github.com/Rosenfan/Matrix</text>
  </g>
</svg>
