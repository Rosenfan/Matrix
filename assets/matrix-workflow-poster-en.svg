<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Matrix Workflow</title>
  <desc id="description">An evidence-driven development workflow for Claude Code and Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020806"/><stop offset=".56" stop-color="#09271b"/><stop offset="1" stop-color="#020a07"/></linearGradient>
    <radialGradient id="hero" cx="78%" cy="18%" r="72%"><stop stop-color="#1d7c51" stop-opacity=".38"/><stop offset=".48" stop-color="#0b2d20" stop-opacity=".16"/><stop offset="1" stop-color="#020806" stop-opacity="0"/></radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#103c29"/><stop offset="1" stop-color="#092719"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#70ffb4" stroke-opacity=".014"/></pattern>
    <style>
      .sans{font-family:Arial,'Helvetica Neue',sans-serif}.mono{font-family:Consolas,monospace}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2.2px;fill:#78fbb7}.title{font-size:86px;font-weight:700;letter-spacing:-2px;fill:#f5fff9}.subtitle{font-size:25px;fill:#c8e6d7}.copy{font-size:18px;fill:#bed9ca}.label{font-size:15px;font-weight:700;letter-spacing:1.6px;fill:#82ffc0}.tiny{font-size:14px;fill:#9bc3ae}.stageEn{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#8cffc6}.stageTitle{font-size:30px;font-weight:700;fill:#f1fff8}.stageBody{font-size:18px;font-weight:700;fill:#e4fff0}.stageMeta{font-size:15px;fill:#accdbb}.featureTitle{font-size:20px;font-weight:700;fill:#f1fff8}.featureText{font-size:15px;fill:#b6d6c4}.footer{font-size:23px;font-weight:700;fill:#effff7}.panel{fill:#071a12;fill-opacity:.34;stroke:#70ffb4;stroke-opacity:.1;stroke-width:1}.stage{fill:url(#stage);stroke:#a4ffd0;stroke-opacity:.18;stroke-width:1}.handoff{fill:#153c2b;fill-opacity:.7;stroke:#a4ffd0;stroke-opacity:.16;stroke-width:1}.feature{fill:#0d2b1e;fill-opacity:.56;stroke:#a4ffd0;stroke-opacity:.12;stroke-width:1}.rail{stroke:#9dffd0;stroke-opacity:.52;stroke-width:2;fill:none}.divider{stroke:#a4ffd0;stroke-opacity:.16;stroke-width:1}.soft{stroke:#a4ffd0;stroke-opacity:.2;stroke-width:1}.chev{fill:none;stroke:#9dffd0;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#hero)"/><rect width="1920" height="1080" fill="url(#grid)"/>
  <g class="sans">
    <text x="108" y="94" class="eyebrow">OPEN SOURCE · AI ENGINEERING WORKFLOW</text><text x="108" y="181" class="title">Matrix Workflow</text><text x="108" y="226" class="subtitle">An evidence-driven development workflow for Claude Code and Codex.</text><text x="108" y="261" class="copy">Move from requirements to archive through a recoverable, auditable delivery path.</text>
    <g transform="translate(1280 92)"><text x="0" y="22" class="label">FOR MATT POCOCK SKILLS POWER USERS</text><path d="M0 38H504" class="soft"/><text x="0" y="66" class="copy">Deep use of mattpocock/skills</text><text x="0" y="92" class="tiny">Matrix turns atomic skills into an auditable workflow.</text></g>
    <rect x="108" y="316" width="1704" height="438" rx="18" class="panel"/>
    <text x="148" y="360" class="label">DEVELOPMENT CONTROL PLANE · FIVE-STAGE EVIDENCE CHAIN</text><text x="1772" y="360" class="tiny" text-anchor="end">OPEN → DESIGN → BUILD → VERIFY → ARCHIVE</text>
    <path d="M174 404H1746" class="rail"/>
    <g>
      <g transform="translate(148 386)"><rect width="296" height="190" rx="22" class="stage"/><text x="28" y="35" class="stageEn">01 · OPEN</text><text x="28" y="77" class="stageTitle">Clarify</text><text x="28" y="111" class="stageBody">Shape the request</text><text x="28" y="145" class="stageMeta">Goal · Scope · Acceptance</text></g>
      <g transform="translate(466 386)"><rect width="296" height="190" rx="22" class="stage"/><text x="28" y="35" class="stageEn">02 · DESIGN</text><text x="28" y="77" class="stageTitle">Design</text><text x="28" y="111" class="stageBody">Set boundaries</text><text x="28" y="145" class="stageMeta">Decisions · Plan · Tests</text></g>
      <g transform="translate(784 386)"><rect width="296" height="190" rx="22" class="stage"/><text x="28" y="35" class="stageEn">03 · BUILD</text><text x="28" y="77" class="stageTitle">Build</text><text x="28" y="111" class="stageBody">Implement in slices</text><text x="28" y="145" class="stageMeta">TDD · Build evidence</text></g>
      <g transform="translate(1102 386)"><rect width="296" height="190" rx="22" class="stage"/><text x="28" y="35" class="stageEn">04 · VERIFY</text><text x="28" y="77" class="stageTitle">Verify</text><text x="28" y="111" class="stageBody">Prove quality</text><text x="28" y="145" class="stageMeta">Tests · Spec review</text></g>
      <g transform="translate(1420 386)"><rect width="296" height="190" rx="22" class="stage"/><text x="28" y="35" class="stageEn">05 · ARCHIVE</text><text x="28" y="77" class="stageTitle">Archive</text><text x="28" y="111" class="stageBody">Commit and trace</text><text x="28" y="145" class="stageMeta">Commit · Log · History</text></g>
    </g>
    <path d="M451 473l8 8-8 8M769 473l8 8-8 8M1087 473l8 8-8 8M1405 473l8 8-8 8" class="chev"/>
    <path d="M148 614H1772" class="soft"/><text x="148" y="647" class="label">CROSS-TOOL HANDOFF · KEEP DESIGN CONTEXT AND VERIFICATION ACCOUNTABILITY</text>
    <g transform="translate(108 669)"><rect width="420" height="56" rx="18" class="handoff"/><text x="24" y="24" class="label">CODEX</text><text x="24" y="46" class="tiny">Design and planning</text><path d="M432 28H586" class="rail"/><rect x="598" width="508" height="56" rx="18" class="handoff"/><text x="622" y="24" class="label">FROZEN DESIGN PACKAGE</text><text x="622" y="46" class="tiny">artifacts/claude-task.md</text><path d="M1118 28H1272" class="rail"/><rect x="1284" width="420" height="56" rx="18" class="handoff"/><text x="1308" y="24" class="label">CLAUDE CODE</text><text x="1308" y="46" class="tiny">Implementation and verification evidence</text></g>
    <g><g transform="translate(108 790)"><rect width="398" height="114" rx="18" class="feature"/><text x="26" y="38" class="featureTitle">Evidence gates</text><text x="26" y="73" class="featureText">Advance only when required artifacts are substantive.</text></g><g transform="translate(540 790)"><rect width="398" height="114" rx="18" class="feature"/><text x="26" y="38" class="featureTitle">Persistent state</text><text x="26" y="73" class="featureText">Recover context from disk-backed change records.</text></g><g transform="translate(972 790)"><rect width="398" height="114" rx="18" class="feature"/><text x="26" y="38" class="featureTitle">Skill orchestration</text><text x="26" y="73" class="featureText">Connect requirements, design, TDD, and review.</text></g><g transform="translate(1404 790)"><rect width="408" height="114" rx="18" class="feature"/><text x="26" y="38" class="featureTitle">Flexible execution</text><text x="26" y="73" class="featureText">full / hotfix / tweak · Codex ↔ Claude Code</text></g></g>
    <path d="M108 960H1812" class="divider"/><text x="108" y="1021" class="footer">Make high-intensity AI-assisted development repeatable.</text><text x="1812" y="994" class="label" text-anchor="end">PROJECT REPOSITORY</text><text x="1812" y="1034" class="mono" font-size="27" font-weight="700" fill="#effff6" text-anchor="end">github.com/Rosenfan/Matrix</text>
  </g>
</svg>
