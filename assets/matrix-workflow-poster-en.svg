<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Matrix Workflow</title>
  <desc id="description">Single-entry autonomous AI agent workflow: Auto runs real runtime checks and Classic enforces five-phase software contracts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020806"/>
      <stop offset=".54" stop-color="#082419"/>
      <stop offset="1" stop-color="#020a07"/>
    </linearGradient>
    <radialGradient id="hero" cx="76%" cy="16%" r="70%">
      <stop offset="0" stop-color="#1d7c51" stop-opacity=".36"/>
      <stop offset=".5" stop-color="#0b2d20" stop-opacity=".15"/>
      <stop offset="1" stop-color="#020806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22ff9f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22ff9f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22ff9f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="autoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11422d"/>
      <stop offset="1" stop-color="#082318"/>
    </linearGradient>
    <linearGradient id="classicCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2d1f"/>
      <stop offset="1" stop-color="#071b13"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#70ffb4" stroke-opacity=".016"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif}
      .mono{font-family:Consolas,'SFMono-Regular',monospace}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:2.2px;fill:#78fbb7}
      .title{font-size:76px;font-weight:700;letter-spacing:-1.8px;fill:#f5fff9}
      .subtitle{font-size:21px;fill:#cdeadd}
      .label{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#82ffc0}
      .tiny{font-size:13.5px;fill:#9ec5b1}
      .hostPrimary{font-size:16px;font-weight:700;fill:#effff7}
      .hostSub{font-size:14px;fill:#b4d6c4}
      .stageStep{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#8cffc6}
      .stageTitle{font-size:26px;font-weight:700;fill:#f3fff9}
      .stageLead{font-size:16px;font-weight:700;fill:#dff9ec}
      .stageBullet{font-size:13.5px;fill:#b3d5c3}
      .classicStep{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#7ef2b8}
      .classicTitle{font-size:19px;font-weight:700;fill:#ecfff5}
      .classicMeta{font-size:13px;fill:#a7cbb8}
      .featureTitle{font-size:19px;font-weight:700;fill:#f2fff8}
      .featureText{font-size:13.5px;fill:#b6d6c4}
      .badgeText{font-size:11.5px;font-weight:700;letter-spacing:1.1px;fill:#052015}
      .badgeOutlineText{font-size:11.5px;font-weight:700;letter-spacing:1.1px;fill:#8cffc6}
      .footer{font-size:21px;font-weight:700;fill:#effff7}
      .panel{fill:#061710;fill-opacity:.48;stroke:#70ffb4;stroke-opacity:.14;stroke-width:1}
      .hostBox{fill:#092218;fill-opacity:.62;stroke:#8cffc6;stroke-opacity:.18;stroke-width:1}
      .autoStage{fill:url(#autoCard);stroke:#9dffd0;stroke-opacity:.26;stroke-width:1.2}
      .classicStage{fill:url(#classicCard);stroke:#8cffc6;stroke-opacity:.16;stroke-width:1}
      .feature{fill:#0b261b;fill-opacity:.64;stroke:#a4ffd0;stroke-opacity:.14;stroke-width:1}
      .badgeFill{fill:#78fbb7}
      .badgeOutline{fill:#103927;stroke:#78fbb7;stroke-opacity:.45;stroke-width:1}
      .rail{stroke:#78fbb7;stroke-opacity:.5;stroke-width:2;fill:none}
      .divider{stroke:#a4ffd0;stroke-opacity:.16;stroke-width:1}
      .chev{fill:none;stroke:#9dffd0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#hero)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M96 226H1824" stroke="url(#beam)" stroke-width="1.5"/>

  <g class="sans">
    <!-- Header -->
    <text x="96" y="84" class="eyebrow">OPEN SOURCE · EVIDENCE-DRIVEN AI AGENT WORKFLOW</text>
    <text x="96" y="162" class="title">Matrix Workflow</text>
    <text x="96" y="202" class="subtitle">One $matrix entrypoint: Auto owns the approach and runs real checks; Classic enforces five-phase contracts.</text>

    <!-- Platform & Token Efficiency Box -->
    <g transform="translate(1216 58)">
      <rect width="608" height="148" rx="14" class="hostBox"/>
      <text x="24" y="32" class="label">HOST PLATFORMS &amp; TOKEN DISCIPLINE</text>
      <path d="M24 44H584" class="divider"/>
      <text x="24" y="72" class="hostPrimary">Dedicated hosts: Claude Code · Codex · ZCode</text>
      <text x="24" y="98" class="hostSub">Shared .agents/skills standard: opencode · Kimi Code &amp; compatible agents</text>
      <text x="24" y="126" class="tiny">Context-pinned brief.md &amp; plan.md + optional lightweight subagent slices avoid repo re-scans</text>
    </g>

    <!-- Main Dual-Workflow Control Plane -->
    <rect x="96" y="242" width="1728" height="524" rx="20" class="panel"/>

    <!-- AUTO Track Header -->
    <g transform="translate(132 268)">
      <rect width="94" height="24" rx="6" class="badgeFill"/>
      <text x="47" y="16" text-anchor="middle" class="badgeText">DEFAULT</text>
      <text x="108" y="17" class="label">AUTO WORKFLOW · UNIVERSAL AUTONOMOUS RUN</text>
      <text x="1656" y="17" text-anchor="end" class="tiny mono">UNDERSTAND → EXECUTE → VERIFY → CLOSE</text>
    </g>

    <path d="M160 424H1760" class="rail" filter="url(#glow)"/>

    <!-- AUTO 4 Stages: 4 * 390 + 3 * 32 = 1656 -->
    <g transform="translate(132 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep">01 · UNDERSTAND</text>
      <text x="26" y="74" class="stageTitle">Investigate &amp; Frame</text>
      <text x="26" y="108" class="stageLead">Read code, docs &amp; Git before asking</text>
      <text x="26" y="144" class="stageBullet">• Freeze goal, observable A1..An &amp; real C1..Cn</text>
      <text x="26" y="170" class="stageBullet">• Refuse commands carrying literal credentials</text>
      <text x="26" y="196" class="stageBullet">• Pin target file coordinates inside brief.md</text>
    </g>

    <g transform="translate(554 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep">02 · EXECUTE</text>
      <text x="26" y="74" class="stageTitle">Slice &amp; Submit</text>
      <text x="26" y="108" class="stageLead">Autonomous slices &amp; runtime checks</text>
      <text x="26" y="144" class="stageBullet">• Record method changes cleanly via run pivot</text>
      <text x="26" y="170" class="stageBullet">• Delegate bounded coding to fast subagents</text>
      <text x="26" y="196" class="stageBullet">• Runtime runs C1..Cn outside lock by exit code</text>
    </g>

    <g transform="translate(976 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep">03 · VERIFY</text>
      <text x="26" y="74" class="stageTitle">Honest Verdict</text>
      <text x="26" y="108" class="stageLead">Cover every A1..An acceptance item</text>
      <text x="26" y="144" class="stageBullet">• Declare reviewer: self | subagent | external</text>
      <text x="26" y="170" class="stageBullet">• Failed items return to execute &amp; track stalls</text>
      <text x="26" y="196" class="stageBullet">• Worktree edits after submit invalidate results</text>
    </g>

    <g transform="translate(1398 308)">
      <rect width="390" height="228" rx="14" class="autoStage"/>
      <text x="26" y="36" class="stageStep">04 · CLOSE</text>
      <text x="26" y="74" class="stageTitle">Atomic Archive</text>
      <text x="26" y="108" class="stageLead">Render report &amp; release run lease</text>
      <text x="26" y="144" class="stageBullet">• Runtime renders read-only verification.md</text>
      <text x="26" y="170" class="stageBullet">• Archive atomically to .matrix/archive/runs/</text>
      <text x="26" y="196" class="stageBullet">• Persist durable facts to AGENTS.md / ADR</text>
    </g>

    <path d="M534 415l9 9-9 9M956 415l9 9-9 9M1378 415l9 9-9 9" class="chev"/>

    <text x="132" y="568" class="tiny">Any goal: Code · Research · Architecture Review · Operations · Docs</text>
    <text x="1788" y="568" text-anchor="end" class="tiny mono">Lean footprint: matrix + matrix-status</text>

    <!-- Track Divider -->
    <path d="M132 590H1788" class="divider"/>

    <!-- CLASSIC Compact Track: 5 * 312 + 4 * 24 = 1656 -->
    <g transform="translate(132 608)">
      <rect width="94" height="22" rx="6" class="badgeOutline"/>
      <text x="47" y="15" text-anchor="middle" class="badgeOutlineText">CLASSIC</text>
      <text x="108" y="16" class="label">FIVE-PHASE SOFTWARE WORKFLOW (FULL · HOTFIX · TWEAK)</text>
      <text x="1656" y="16" text-anchor="end" class="tiny">Byte-frozen Contract · Phase guards · Optional Arch orchestration · Return / Abort</text>
    </g>

    <g transform="translate(132 644)">
      <g transform="translate(0 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep">01 · OPEN</text>
        <text x="20" y="56" class="classicTitle">Clarify Proposal</text>
        <text x="20" y="78" class="classicMeta">proposal.md · scope &amp; risks</text>
      </g>
      <g transform="translate(336 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep">02 · DESIGN</text>
        <text x="20" y="56" class="classicTitle">Freeze Contract</text>
        <text x="20" y="78" class="classicMeta">design · plan · executor gate</text>
      </g>
      <g transform="translate(672 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep">03 · BUILD</text>
        <text x="20" y="56" class="classicTitle">Vertical Slices</text>
        <text x="20" y="78" class="classicMeta">TDD · pinned file coordinates</text>
      </g>
      <g transform="translate(1008 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep">04 · VERIFY</text>
        <text x="20" y="56" class="classicTitle">Dual-Axis Review</text>
        <text x="20" y="78" class="classicMeta">Standards &amp; Spec · Arch receipt</text>
      </g>
      <g transform="translate(1344 0)">
        <rect width="312" height="94" rx="10" class="classicStage"/>
        <text x="20" y="28" class="classicStep">05 · ARCHIVE</text>
        <text x="20" y="56" class="classicTitle">2-Step Commit</text>
        <text x="20" y="78" class="classicMeta">dry-run · preflight sha256</text>
      </g>
      <path d="M320 40l7 7-7 7M656 40l7 7-7 7M992 40l7 7-7 7M1328 40l7 7-7 7" class="chev"/>
    </g>

    <!-- Bottom 4 Feature Cards: 4 * 414 + 3 * 24 = 1728 -->
    <g transform="translate(96 792)">
      <g transform="translate(0 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="58" height="22" rx="5" class="badgeFill"/>
        <text x="53" y="35" text-anchor="middle" class="badgeText">AUTO</text>
        <text x="24" y="70" class="featureTitle">Runtime-Executed Gate</text>
        <text x="24" y="98" class="featureText">Executes frozen checks outside the lock by</text>
        <text x="24" y="120" class="featureText">exit code; post-pass edits invalidate close.</text>
      </g>

      <g transform="translate(438 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="82" height="22" rx="5" class="badgeOutline"/>
        <text x="65" y="35" text-anchor="middle" class="badgeOutlineText">CLASSIC</text>
        <text x="24" y="70" class="featureTitle">Two-Axis Review Enforcement</text>
        <text x="24" y="98" class="featureText">Requires substantive Standards &amp; Spec sections</text>
        <text x="24" y="120" class="featureText">and hash-bound review receipts under Arch.</text>
      </g>

      <g transform="translate(876 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="132" height="22" rx="5" class="badgeOutline"/>
        <text x="90" y="35" text-anchor="middle" class="badgeOutlineText">AUTO · CLASSIC</text>
        <text x="24" y="70" class="featureTitle">Disk Ledger &amp; Direct Resume</text>
        <text x="24" y="98" class="featureText">WAL journals, revision guards &amp; continuation</text>
        <text x="24" y="120" class="featureText">let any agent resume from .matrix/ cleanly.</text>
      </g>

      <g transform="translate(1314 0)">
        <rect width="414" height="142" rx="14" class="feature"/>
        <rect x="24" y="20" width="58" height="22" rx="5" class="badgeFill"/>
        <text x="53" y="35" text-anchor="middle" class="badgeText">AUTO</text>
        <text x="24" y="70" class="featureTitle">Lease &amp; Stagnation Circuit</text>
        <text x="24" y="98" class="featureText">Single active run lease per worktree; repeated</text>
        <text x="24" y="120" class="featureText">check failures or 2 stalled rounds pause safely.</text>
      </g>
    </g>

    <!-- Footer -->
    <path d="M96 962H1824" class="divider"/>
    <text x="96" y="1018" class="footer">Turn autonomous AI execution into auditable, recoverable, token-lean delivery.</text>
    <text x="1824" y="994" text-anchor="end" class="label">PROJECT REPOSITORY</text>
    <text x="1824" y="1030" text-anchor="end" class="mono" font-size="25" font-weight="700" fill="#effff6">github.com/Rosenfan/Matrix</text>
  </g>
</svg>
